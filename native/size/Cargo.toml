[package]
name = "pytorch-rs-size"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Native immutable torch.Size compatibility type for pytorch-rs"
repository = "https://github.com/bobrenjc93/pytorch-rs"

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
