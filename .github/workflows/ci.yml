name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: uv venv --clear --python 3.12
      - run: uv sync --locked --no-install-project
      - run: uv pip install --python .venv/bin/python 'maturin>=1.14,<2'
      - run: PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo clippy --all-targets --features python-bindings -- -D warnings
      - run: PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo test --all-targets --features python-bindings
      - run: env -u CONDA_PREFIX VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" .venv/bin/maturin develop --release --uv
      - name: Verify native-extension provenance
        run: "$GITHUB_WORKSPACE/.venv/bin/python" .github/scripts/verify_native_extension.py
      - name: Run Python suite
        run: |
          if "$GITHUB_WORKSPACE/.venv/bin/python" -m unittest discover -s tests -p 'test_*.py'; then
            :
          else
            status=$?
            echo "Python suite failed; resolved native-extension paths:"
            "$GITHUB_WORKSPACE/.venv/bin/python" .github/scripts/verify_native_extension.py || true
            exit "$status"
          fi
