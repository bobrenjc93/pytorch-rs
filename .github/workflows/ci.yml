name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@e554b93b803acbf50c9fddb6909954b797ae12d5 # v6.8.0
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: uv venv --clear --python 3.12
      - run: uv sync --locked --no-install-project
      - run: PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo clippy --all-targets --features python-bindings -- -D warnings
      - run: PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" cargo test --all-targets --features python-bindings
      - run: env -u CONDA_PREFIX TMPDIR="$GITHUB_WORKSPACE/target" VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" .venv/bin/maturin build --release --out target/wheels
      - run: uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" --force-reinstall --no-deps target/wheels/torch_rs-*.whl
      - name: Verify native-extension provenance
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" .github/scripts/verify_native_extension.py
      - name: Run Python suite
        run: |
          if "$GITHUB_WORKSPACE/.venv/bin/python" -m unittest discover -s tests -p 'test_*.py'; then
            :
          else
            status=$?
            echo "Python suite failed; resolved native-extension paths:"
            "$GITHUB_WORKSPACE/.venv/bin/python" .github/scripts/verify_native_extension.py || true
            exit "$status"
          fi

  python-314:
    name: Python 3.14 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "1.92.0"
      - uses: astral-sh/setup-uv@e554b93b803acbf50c9fddb6909954b797ae12d5 # v6.8.0
        with:
          python-version: "3.14"
      - run: uv venv --clear --python 3.14
      - run: uv sync --locked --no-install-project --group reference
      - name: Build Python 3.14 abi3 release wheel
        run: env -u CONDA_PREFIX TMPDIR="$GITHUB_WORKSPACE/target" VIRTUAL_ENV="$GITHUB_WORKSPACE/.venv" PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python" .venv/bin/maturin build --release --out target/wheels
      - run: uv pip install --python "$GITHUB_WORKSPACE/.venv/bin/python" --force-reinstall --no-deps target/wheels/torch_rs-*-cp310-abi3-*.whl
      - name: Verify native-extension provenance
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" .github/scripts/verify_native_extension.py
      - name: Run full Python 3.14 compatibility suite
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -c 'import sys, torch; assert sys.version_info[:2] == (3, 14), sys.version; assert torch.__version__.split("+")[0] == "2.13.0", torch.__version__'
          "$GITHUB_WORKSPACE/.venv/bin/python" -m unittest discover -s tests -p 'test_*.py'
