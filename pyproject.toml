[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "torch-rs"
version = "0.1.0"
description = "A PyTorch-compatible Python API backed by a native Rust tensor engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND LicenseRef-NVIDIA-CUDA"
license-files = [
  "LICENSE",
  "src/cuda/NOTICE.md",
  "docs/diagnostics/compile-gelu-vendor/notices/requested-CUDA11.8-LICENSE.txt",
  "docs/diagnostics/compile-gelu-vendor/notices/compiler-CUDA12.8-LICENSE.txt",
  "docs/diagnostics/compile-gelu-linked/notices/CUDA13-LICENSE.txt",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]
dependencies = ["typing-extensions>=4.10"]

[dependency-groups]
dev = ["maturin>=1.14,<2", "numpy>=2"]
reference = ["torch==2.13.0"]

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "torch_rs.torch_rs"
strip = true
