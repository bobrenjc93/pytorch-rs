[package]
name = "pytorch-rs-python-layout"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
publish = false

[dependencies]
pyo3 = { version = "0.29.2", default-features = false, features = ["abi3-py310"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
