[package]
name = "pytorch-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "A native Rust tensor and deep-learning library pursuing PyTorch semantics and performance"
repository = "https://github.com/bobrenjc93/pytorch-rs"

[lib]
name = "pytorch_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python-bindings = ["dep:pyo3"]
extension-module = ["python-bindings", "pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", optional = true, features = ["abi3-py310", "multiple-pymethods"] }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
