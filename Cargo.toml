[package]
name = "pytorch-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "A native Rust tensor and deep-learning library pursuing PyTorch semantics and performance"
repository = "https://github.com/bobrenjc93/pytorch-rs"

[workspace]
members = ["native/size"]
default-members = [".", "native/size"]
resolver = "3"

[lib]
name = "pytorch_rs"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
pytorch-rs-size = { version = "0.1.0", path = "native/size" }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
